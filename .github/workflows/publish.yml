name: publish

# Every push to main is published at once, from the verdicts stored so far: a release the
# judging job has not reached yet is listed with no verdict on a build, never a guessed one.
# fit.yml starts this again when it has stored new verdicts, so they follow in the next index.
# No run waits for main to stand still.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  registry_v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      unsigned: ${{ steps.prepare.outputs.unsigned }}
      pages: ${{ steps.prepare.outputs.pages }}
      sha256: ${{ steps.prepare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/registry-tool
      - name: Generate and validate the v2 catalogue
        id: prepare
        run: |
          set -euo pipefail
          bot=target/release/registry-bot
          serial=$(date -u +%s)
          if [[ ! -f registry/index-key.pub || "$GITHUB_REF" != refs/heads/main ]]; then
            "$bot" index . --serial "$serial" --out v2-stage
            echo 'Registry v2 was checked offline. Publication needs the public key and main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Nothing is judged or downloaded here: the index is assembled from main and the
          # verdicts the fit job has stored. A cell it has not judged yet is left out.
          python3 -I .github/registry-v2/fit_store.py read
          "$bot" index . --serial "$serial" --out v2-stage --generated-fit
          tar -C v2-stage -cf "$RUNNER_TEMP/v2-pages.tar" pages
          echo "sha256=$(sha256sum < v2-stage/index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "unsigned=unsigned-v2-index-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "pages=v2-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.unsigned != ''
        with:
          name: ${{ steps.prepare.outputs.unsigned }}
          path: v2-stage/index.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.pages != ''
        with:
          name: ${{ steps.prepare.outputs.pages }}
          path: ${{ runner.temp }}/v2-pages.tar
          if-no-files-found: error

  sign:
    needs: registry_v2
    if: github.ref == 'refs/heads/main' && needs.registry_v2.outputs.unsigned != ''
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      signed: ${{ steps.sign.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/registry-v2
            registry/index-key.pub
          sparse-checkout-cone-mode: false
      # A merge while this run works does not stop it: the run publishes its own commit and the
      # queued run for the newer commit publishes after it.
      - name: Require a commit of main that is not older than the deployed one
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/registry-v2/live.py --publishable "$GITHUB_SHA"
      # The release archive of minisign 0.12 and its x86_64 binary, by SHA-256. Three retries after
      # 1, 2 and 4 seconds, as the bot's downloads: --retry alone leaves a reset connection
      # (curl 35) alone, so every error is retried, and the SHA-256 checks still decide.
      - name: Get minisign for signing only
        run: |
          set -euo pipefail
          curl --disable --proto '=https' --proto-redir '=https' -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/minisign.tar.gz" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum --check --strict -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/minisign.tar.gz" minisign-linux/x86_64/minisign
          echo "2c74dffcc1c9a5ee55957c60971998ace2b89f22585631594ec2152c588af8db  $RUNNER_TEMP/minisign-linux/x86_64/minisign" | sha256sum --check --strict -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.registry_v2.outputs.unsigned }}
          path: payload
      - name: Verify the artifact hash and sign the index
        id: sign
        env:
          EXPECTED_SHA256: ${{ needs.registry_v2.outputs.sha256 }}
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -f registry/index-key.pub && "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  payload/index.json\n' "$EXPECTED_SHA256" | sha256sum --check --status
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${REGISTRY_SIGNING_KEY:?missing registry signing key}" > "$key"
          unset REGISTRY_SIGNING_KEY
          "$RUNNER_TEMP/minisign-linux/x86_64/minisign" -S -s "$key" -m payload/index.json -t 'Sunrise mod registry v2'
          echo "name=signed-v2-index-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.sign.outputs.name }}
          path: |
            payload/index.json
            payload/index.json.minisig
          if-no-files-found: error

  # Authenticates the signed candidate, stages the site and runs the deploy guard on it.
  stage:
    needs: [registry_v2, sign]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: read
      statuses: read
    outputs:
      attempt: ${{ github.run_attempt }}
      record: ${{ steps.guard.outputs.record }}
      v2_failed: ${{ steps.guard.outputs.v2_failed }}
      snapshot: ${{ steps.guard.outputs.snapshot }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/registry-tool
            .github/registry-v2
            bot/src/index_signature.rs
            bot/verifier
            registry/index-key.pub
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/registry-tool
        with:
          name: registry-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: signed
        if: needs.sign.result == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.sign.outputs.signed }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: images
        if: needs.sign.result == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.registry_v2.outputs.pages }}
      - name: Authenticate the candidate or recover the last complete v2 snapshot, and check its serial against the deployed one
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ needs.registry_v2.result }}
          SIGNED: ${{ steps.signed.outcome }}
          IMAGES: ${{ steps.images.outcome }}
        run: |
          set -euo pipefail
          mkdir site
          if [[ ! -f registry/index-key.pub ]]; then
            if [[ "$PREPARE" != success ]]; then
              echo 'v2_failed=true' >> "$GITHUB_OUTPUT"
            fi
          else
            verifier="$RUNNER_TEMP/index-verifier/release/registry-bot"
            args=()
            if [[ "$SIGNED" != success || "$IMAGES" != success ]]; then
              args=(--candidate unavailable-v2-candidate)
            fi
            if ! python3 -I .github/registry-v2/live.py --bot "$verifier" --assemble site "${args[@]}"; then
              echo 'NO_AUTHENTICATED_V2_SNAPSHOT: preserving the existing Pages site without deploying.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "snapshot=v2-snapshot-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
            args=()
            if grep -qx 'carried=true' "$GITHUB_OUTPUT"; then
              args=(--carried)
              echo 'v2_failed=true' >> "$GITHUB_OUTPUT"
              echo 'The new catalogue failed. Deploying the previous authenticated snapshot again.' >> "$GITHUB_STEP_SUMMARY"
            fi
            python3 -I .github/registry-v2/live.py --bot "$verifier" --guard-deploy site/v2 "${args[@]}"
          fi
          # A merge while this run works does not stop it: the run publishes its own commit and the
          # queued run for the newer commit publishes after it. Checked once, last, because the
          # verification spans network requests: a commit that left main in the meantime is not deployed.
          python3 -I .github/registry-v2/live.py --publishable "$GITHUB_SHA"
      # Launchers read Sunrise's release list from here when GitHub's API is rate-limiting their
      # network. This workflow is the site's only writer, so the copy is made here: on every
      # publish, and every half hour by timer.yml. A failure stops the deployment, and the site
      # keeps the list it has.
      - name: Copy Sunrise's release list into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/sunrise-org/sunrise/releases?per_page=100' |
            python3 -I .github/registry-v2/game_releases.py site/github/repos/sunrise-org/sunrise/releases
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      # The next publish's guard and this run's confirm-live read the snapshot.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.guard.outputs.snapshot != ''
        with:
          name: ${{ steps.guard.outputs.snapshot }}
          path: site/v2/
          if-no-files-found: error

  # deploy-pages does not see an artifact uploaded by its own job, so the deployment is a job of
  # its own. It deploys only what stage guarded in the same attempt: a retry of this job alone
  # would deploy a site whose guard ran before whatever was deployed since.
  deploy:
    needs: stage
    if: always() && !cancelled() && needs.stage.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}v2/index.signed
    steps:
      - name: Require the site staged in this attempt
        env:
          STAGED: ${{ needs.stage.outputs.attempt }}
        run: |
          if [[ "$STAGED" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "::error::The site was staged in attempt $STAGED. Re-run all jobs, not only the failed ones."
            exit 1
          fi
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Pages can report a deployment and still serve the previous files. Readers fetch one file,
  # so they never see a mixed pair; this makes a site that did not take the deployment a red run.
  confirm-live:
    needs: [stage, deploy]
    if: always() && !cancelled() && needs.deploy.result == 'success' && needs.stage.outputs.snapshot != ''
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/registry-tool
            .github/registry-v2
            bot/src/index_signature.rs
            bot/verifier
            registry/index-key.pub
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/registry-tool
        with:
          name: registry-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.stage.outputs.snapshot }}
          path: deployed
      - name: Wait until the site serves the deployed signed index
        run: |
          set -euo pipefail
          python3 -I .github/registry-v2/live.py --bot "$RUNNER_TEMP/index-verifier/release/registry-bot" \
            --confirm-live deployed

  # The next deploy's guard reads this when the bulk snapshot artifact cannot be fetched.
  record-deployment:
    needs: [stage, deploy]
    if: always() && !cancelled() && needs.deploy.result == 'success' && needs.stage.outputs.record != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the deployed serial and index digest on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ needs.stage.outputs.record }}
          DEPLOY_ATTEMPT: ${{ needs.stage.outputs.attempt }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -X POST -f state=success \
            -f context=registry-v2/deployed -f description="$RECORD" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$DEPLOY_ATTEMPT"

  report-v2-failure:
    needs: [stage, deploy]
    if: always() && !cancelled() && needs.deploy.result == 'success' && needs.stage.outputs.v2_failed == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo 'The previous snapshot was deployed again: the new index did not publish.'
          exit 1
