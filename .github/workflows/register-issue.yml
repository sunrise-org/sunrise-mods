name: register-issue
# The number is in the run's title so the timer can count, from GitHub's history, how often an issue was asked about.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Registration retry for issue {0}', inputs.issue) || format('Registration of issue {0}', github.event.issue.number) }}

# A "Register a repository" issue is handed to the registry service, which does what the site's form does:
# it reads the issue itself, checks the repository and opens the registration pull request. This workflow is
# only the trigger. It sends the issue's number and this run's GitHub OIDC token, by which the service knows
# the call comes from this file on main, and writes the answer on the issue. Nothing from the issue's text
# reaches a script here, and the repository being registered is never checked out or run.
#
# It runs for the opener's own event, and by dispatch for a retry: the timer (timer.yml) starts one for an issue the
# registry has not answered, and a maintainer can start one (`gh workflow run register-issue.yml
# -R sunrise-org/sunrise-mods --ref main -f issue=N`; an Actions "re-run" is refused). A dispatch names only the issue:
# the registry reads the issue's live opener and registers that account, never whoever dispatched. There is no retry
# loop in a run.
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the open Register issue to check again.
        required: true
        type: string

permissions: {}

# One run at a time for an issue, however it was started.
concurrency:
  group: register-issue-${{ github.event.issue.number || inputs.issue }}

jobs:
  register:
    # The register form's title; `if` is evaluated by Actions, never by a shell.
    # An event is the opener's own, on an open issue: someone else's edit or reopening registers nothing.
    # A dispatch is checked by the registry, which refuses an issue that is closed or not titled `Register `.
    # Only the run the event started: a re-run would carry the opener's identity for whoever asked for it,
    # against an issue that may have been edited since. The registry refuses a re-run's token as well.
    if: >-
      github.ref == 'refs/heads/main'
      && github.run_attempt == 1
      && (github.event_name == 'workflow_dispatch'
        || (startsWith(github.event.issue.title, 'Register ')
          && github.event.issue.state == 'open'
          && github.event.sender.id == github.event.issue.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # this repository's own script
      id-token: write # the OIDC token the registry service checks
      issues: write # the answer on the issue
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
      # The service's route, and the audience it requires of the token.
      REGISTRY: https://playsunrise.net/api/mods/issue-registration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Always ends with a status, 000 when there was none: the next step reads it and says what it means.
      - name: Ask the registry
        id: ask
        env:
          ANSWER: ${{ runner.temp }}/answer.json
        run: |
          set -euo pipefail
          status=000
          if token=$(curl -sS --fail --max-time 30 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=$REGISTRY" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er .value); then
            echo "::add-mask::$token"
            # One call per run: the service answers a repeat with the same pull request, and a retry is another run.
            status=$(jq -n --argjson issue "$ISSUE" --arg token "$token" '{issue: $issue, token: $token}' |
              curl -sS --max-time 180 -o "$ANSWER" -w '%{http_code}' -X POST \
                -H 'Content-Type: application/json' --data @- "$REGISTRY") || status=000
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # The one status comment on the issue, and a red run when a maintainer should look.
      - name: Say what the registry answered
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.ask.outputs.status }}
          ANSWER: ${{ runner.temp }}/answer.json
        run: python3 -I bot/ci/registration_retry.py answer
