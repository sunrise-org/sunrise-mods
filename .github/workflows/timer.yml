name: registry timer
# GitHub delivers almost none of this organization's scheduled events, so the registry's
# ten-minute job (the release watcher) is started from here instead. Each run starts
# it, waits ten minutes and starts the next run of this workflow. A push to main or a schedule event
# that does arrive starts the chain again if it has stopped; the concurrency group keeps it to one chain,
# because a waiting run is replaced by a newer one. Cancelling a run stops the chain.
#
# Each run also asks whether Sunrise has published a release the judging job has not looked at,
# and starts the judging job when it has. That job owns the offered-build policy; this one only
# compares names. That look is outside the chain's concurrency group, so it happens when the run
# starts, whatever the chain is doing.

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Start the judging job whether or not Sunrise has a new release.
        type: boolean
        default: false

permissions: {}

jobs:
  tick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On this job, not the workflow: a run started while the chain waits must still look for
    # builds at once, and only its place in the chain is replaced.
    concurrency:
      group: registry-timer
      cancel-in-progress: false
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the release watcher
        run: gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main
      # The site carries a copy of Sunrise's release list that launchers check every half hour;
      # a publish refreshes it. Runs of this chain are a little over ten minutes apart, so the
      # third one after a publish is the first to find it 25 minutes old: a publish about every
      # half hour.
      - name: Start a publish when the last one is half an hour old
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --branch main --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          if [[ -z "$last" ]] || (( $(date +%s) - $(date -d "$last" +%s) >= 1500 )); then
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
      - name: Wait ten minutes
        if: ${{ !cancelled() }}
        run: sleep 600
      - name: Start the next run
        if: ${{ !cancelled() }}
        run: gh workflow run timer.yml --repo "$GITHUB_REPOSITORY" --ref main

  builds:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Game builds and SDKs are the Sunrise releases that carry an SDK descriptor. A failure
      # here (GitHub's API, a rate limit, an unreadable answer) is only a missed look: the next
      # run looks again, and nothing else waits for this job.
      - name: Look for Sunrise releases the judging job has not considered
        id: look
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -I .github/registry-v2/fit_store.py read --optional
          [[ -f registry/fit/considered.json ]] || echo '[]' > registry/fit/considered.json
          gh api 'repos/sunrise-org/sunrise/releases?per_page=100' > "$RUNNER_TEMP/releases.json"
          new=$(jq -r --slurpfile considered registry/fit/considered.json \
            -f .github/registry-v2/new_releases.jq "$RUNNER_TEMP/releases.json")
          echo "${new:-No new Sunrise release.}" >> "$GITHUB_STEP_SUMMARY"
          echo "new=$(wc -w <<< "$new")" >> "$GITHUB_OUTPUT"
      - name: Warn that this run could not look
        if: steps.look.outcome == 'failure'
        run: echo "::warning::Could not look for new Sunrise releases; the next run looks again."
      # The judging job also asks Modrinth whether it still lists each original jar the releases
      # name, so while any release names one it runs on every tick.
      - name: Look for releases that name original jars
        id: jars
        run: |
          if grep -rqsx '\[\[jars\]\]' registry/projects/*/releases/; then echo named=true >> "$GITHUB_OUTPUT"; fi
      - name: Start the judging job
        if: steps.look.outputs.new > 0 || steps.jars.outputs.named == 'true' || inputs.force
        continue-on-error: true
        run: gh workflow run fit.yml --repo "$GITHUB_REPOSITORY" --ref main
      # A new game build may be ahead of the Sunrise crates the tool is pinned at.
      - name: Ask whether the tool's pin should follow
        if: steps.look.outputs.new > 0 || inputs.force
        continue-on-error: true
        run: gh workflow run bot-pin.yml --repo "$GITHUB_REPOSITORY" --ref main
