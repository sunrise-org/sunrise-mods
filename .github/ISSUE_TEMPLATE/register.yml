name: Register a repository
description: Ask for your mod's repository to be tracked by the registry, so its releases are picked up
title: "Register <owner>/<repository>"
body:
  - type: markdown
    attributes:
      value: |
        The registry checks that the repository is public and belongs to your account and opens its registration pull request, as the form at https://playsunrise.net/mods/submit does; the answer is a comment here. Nothing in the repository is read. Registering lists nothing by itself: a project appears in Discover after its first release through `cargo sunrise-mod release` is reviewed and merged.

        An issue can register only a public repository that belongs to the personal account opening it. For an organisation's repository, an admin of it uses the form at https://playsunrise.net/mods/submit instead.

        If the registry cannot finish the check, it tries again by itself every ten minutes, up to five more times, and the comment here says so. Edit this issue only when the comment tells you what to change.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The link to your public GitHub repository
      placeholder: https://github.com/<owner>/<repository>
    validations:
      required: true
